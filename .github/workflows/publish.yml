name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore src/

      - name: Test
        run: dotnet test tests/ --no-restore

      - name: Pack
        run: |
          dotnet pack src/Archetype.Core/Archetype.Core.csproj -c Release -p:Version=${{ env.VERSION }} --no-restore --output ./nupkg
          dotnet pack src/Archetype.Engine/Archetype.Engine.csproj -c Release -p:Version=${{ env.VERSION }} --no-restore --output ./nupkg
          dotnet pack src/Archetype.Text/Archetype.Text.csproj -c Release -p:Version=${{ env.VERSION }} --no-restore --output ./nupkg
          dotnet pack src/Archetype.Build/Archetype.Build.csproj -c Release -p:Version=${{ env.VERSION }} --no-restore --output ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
